name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (${{ matrix.os }}, ${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        compiler: [gcc-13, gcc-14, clang-18]
        build_type: [Debug, Release]
        include:
          - os: macos-14
            compiler: appleclang
            build_type: Release
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        env:
          OS: ${{ matrix.os }}
          COMPILER: ${{ matrix.compiler }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          case "$COMPILER" in
            gcc-*)
              package="g++-${COMPILER#gcc-}"
              echo "CC=$COMPILER" >> "$GITHUB_ENV"
              echo "CXX=g++-${COMPILER#gcc-}" >> "$GITHUB_ENV"
              ;;
            clang-*)
              package="$COMPILER"
              echo "CC=$COMPILER" >> "$GITHUB_ENV"
              echo "CXX=clang++-${COMPILER#clang-}" >> "$GITHUB_ENV"
              ;;
            *)
              package=""
              ;;
          esac
          if [ "$OS" = macos-14 ]; then
            brew install ninja
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ninja-build "$package"
          fi

      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build/ci

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure --no-tests=error

      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: build/**/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  sanitize:
    name: sanitize (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang-18
      CXX: clang++-18
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: address,undefined
            ctest_args: ""
          # The simulator and its determinism test are single-threaded, so ThreadSanitizer has
          # nothing to find in them, and three runs of them took most of this job's time budget:
          # they run once, below, with fewer seeds, and every other test runs three times.
          - sanitizer: thread
            ctest_args: --repeat until-fail:3 -E ^(sim|determinism)_test$
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang-18

      # ThreadSanitizer aborts with "unexpected memory mapping" under the runner's default ASLR
      # entropy.
      - name: Lower the address-space randomisation
        if: matrix.sanitizer == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake -S . -B build/sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DSHALE_SANITIZE=${{ matrix.sanitizer }}

      - name: Build
        run: cmake --build build/sanitize

      - name: Test
        env:
          CTEST_ARGS: ${{ matrix.ctest_args }}
        # CTEST_ARGS is deliberately unquoted: it is a list of words, and empty for the first entry.
        run: ctest --test-dir build/sanitize --output-on-failure --no-tests=error $CTEST_ARGS

      # Twenty seeds is the fewest for which the simulator still asserts its scaled floors.
      - name: Test the simulator once
        if: matrix.sanitizer == 'thread'
        env:
          SHALE_SIM_SEEDS: "20"
        run: >
          ctest --test-dir build/sanitize --output-on-failure --no-tests=error
          -R "^(sim|determinism)_test$"

      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-sanitize-${{ matrix.sanitizer }}
          path: build/**/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # A suite that has only passed has not shown that it can fail. Each job builds the simulator with
  # one deliberate flaw compiled in and requires it to go red, so a green job means the flaw was
  # caught, and its summary names the invariant that caught it. Keep the names in step with
  # SHALE_FLAW_NAMES in cmake/ShaleOptions.cmake.
  flaws:
    name: flaws (${{ matrix.flaw }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang-18
      CXX: clang++-18
    strategy:
      fail-fast: false
      matrix:
        flaw:
          - skip_wal_sync
          - skip_dir_sync
          - drop_tombstones_early
          - ignore_snapshots_in_compaction
          - skip_manifest_sync
          - delete_live_files
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang-18

      - name: Build the simulator with the flaw in, and require it to fail
        env:
          FLAW: ${{ matrix.flaw }}
        run: scripts/run-flaws.sh "$FLAW"

      - name: Upload the simulator output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sim-output-${{ matrix.flaw }}
          path: build/flaw-${{ matrix.flaw }}/sim-output.log
          if-no-files-found: ignore

  # The engine under a real kill: a writer process that puts and deletes keys is stopped with
  # SIGKILL at a random moment, and the database that is opened again must hold exactly what the
  # writer was told was done. The simulator cannot show this, since its filesystem is not the real
  # one, and the unit tests never kill a process. macOS is here because it is a different kernel and
  # a different filesystem under the same engine; a kill of the process cannot tell how the writes
  # are synced.
  crash:
    name: crash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        env:
          OS: ${{ matrix.os }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          if [ "$OS" = macos-14 ]; then
            brew install ninja
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ninja-build
          fi

      # Only the tool is built, so that GoogleTest is not fetched.
      - name: Configure
        run: >
          cmake -S . -B build/crash -G Ninja -DCMAKE_BUILD_TYPE=Release -DSHALE_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build/crash --target shale_crashtest

      # The seed changes with every run, so that the kill delays and the keys differ. It does not
      # repeat a run: where in the engine's work a kill lands depends on timing, so the database
      # that a failed run leaves, uploaded below, is what to look at. --min_compactions=1 makes a
      # run that never saw a table removed, so that no kill reached a compaction that merged, fail
      # instead of passing. The second run puts the fsync calls in the path as well: it is slower,
      # and meant only to be killed in them now and then. Two hundred rounds take about a minute.
      # Two flaws injected by hand, each open only for the width of one MANIFEST edit, were each
      # caught in one of six local runs of twenty rounds, and in four and five of six runs of up to
      # 150.
      - name: Kill the writer two hundred times, and check the database each time
        env:
          SEED: ${{ github.run_number }}
        run: |
          mkdir -p "$RUNNER_TEMP/crash"
          build/crash/tools/shale_crashtest --rounds=200 --seed="$SEED" --min_compactions=1 \
            --db="$RUNNER_TEMP/crash/db"

      - name: Kill a writer that syncs six times
        env:
          SEED: ${{ github.run_number }}
        run: |
          build/crash/tools/shale_crashtest --rounds=6 --seed="$SEED" --sync \
            --db="$RUNNER_TEMP/crash/db-sync"

      - name: Upload the database
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash-db-${{ matrix.os }}
          path: ${{ runner.temp }}/crash
          if-no-files-found: ignore

  # Every decoder that reads bytes off a disk, the recovery of the table set from CURRENT and a
  # MANIFEST, and the whole database under a random program of operations, under libFuzzer with
  # AddressSanitizer and UndefinedBehaviorSanitizer. Sixty seconds a target is a smoke run, long
  # enough to start from the seed corpus and to catch what a change has just made easy to reach; it
  # is not a campaign, and a clean run says nothing about inputs it did not try. A crash is a bug in
  # the engine, so the input that caused it is uploaded: the fuzz targets reproduce it, run with the
  # file as their only argument.
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v7

      # libclang-rt-18-dev holds the libFuzzer runtime that -fsanitize=fuzzer links, and the
      # sanitizer runtimes; it is named here and not left to what clang-18 happens to pull in.
      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang-18 libclang-rt-18-dev

      - name: Configure
        run: cmake --preset fuzz

      # Only the fuzz targets: the preset instruments the test suite too, which a fuzz run does not
      # use.
      - name: Build
        run: cmake --build --preset fuzz --target fuzz_targets

      # The targets are those of fuzz/fuzz_targets.txt, the file the build reads too, so a target
      # that is added there is run here with no other change. Every target runs even when an
      # earlier one has crashed, so that one run reports all the crashes there are; the step fails
      # at the end. libFuzzer writes the inputs it finds to the first directory it is given and only
      # reads the second, which is the seed corpus.
      - name: Fuzz each target for sixty seconds
        run: |
          mkdir -p build/fuzz/crashes
          status=0
          while read -r target _; do
            case "$target" in '' | '#'*) continue ;; esac
            mkdir -p build/fuzz/found/"$target"
            build/fuzz/fuzz/"$target" -max_total_time=60 -timeout=60 \
              -artifact_prefix=build/fuzz/crashes/"$target"- \
              build/fuzz/found/"$target" build/fuzz/fuzz/corpus/"$target" </dev/null || status=1
          done < fuzz/fuzz_targets.txt
          exit "$status"

      # The crash-*, oom-* and timeout-* files that libFuzzer wrote, one prefixed with its target.
      - name: Upload the inputs that failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: build/fuzz/crashes/
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The whole history, so that check-hygiene.sh scans every commit message.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang-18 doxygen

      # Keep these versions in step with scripts/preflight.sh.
      - name: Install the pinned clang-format and clang-tidy
        run: |
          python3 -m venv "$RUNNER_TEMP/lint-tools"
          "$RUNNER_TEMP/lint-tools/bin/pip" install clang-format==23.1.3 clang-tidy==22.1.8
          echo "$RUNNER_TEMP/lint-tools/bin" >> "$GITHUB_PATH"

      - name: clang-format
        run: git ls-files -z -- '*.h' '*.cc' | xargs -0 -r clang-format --dry-run --Werror

      - name: Layering
        run: bash scripts/check-layering.sh

      - name: Hygiene
        run: bash scripts/check-hygiene.sh

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: >
          cmake -S . -B build/lint -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DSHALE_BUILD_TESTS=OFF

      - name: clang-tidy
        run: git ls-files -z -- 'src/*.cc' 'tools/*.cc' | xargs -0 -r clang-tidy -p build/lint --quiet

      - name: Doxygen
        run: cmake --build build/lint --target docs

  # Does the benchmark tool run, and do the micro benchmarks? The job asserts completion and nothing
  # else: a shared runner is too noisy for any number to be held to, so none is. What is asserted
  # about the tool's answers is its own: it checks every read against what it wrote, and exits with
  # status 1 on a wrong one. The numbers go up as a file all the same, so that a run can be looked
  # at.
  bench-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      # Only the benchmarks are built, so that GoogleTest is not fetched.
      - name: Configure
        run: >
          cmake -S . -B build/bench -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DSHALE_BUILD_BENCH=ON -DSHALE_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build/bench --target shale_bench micro_bench

      - name: Run every workload on a small database
        run: |
          mkdir -p "$RUNNER_TEMP/bench"
          build/bench/tools/shale_bench --num=20000 --sync_num=200 --repeat=1 \
            --db="$RUNNER_TEMP/bench/db" --json="$RUNNER_TEMP/bench/result.json"

      - name: Run the micro benchmarks for a moment
        run: build/bench/bench/micro_bench --benchmark_min_time=0.01s

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-smoke-result
          path: ${{ runner.temp }}/bench/result.json
          if-no-files-found: ignore
