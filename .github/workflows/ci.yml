name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (${{ matrix.os }}, ${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        compiler: [gcc-13, gcc-14, clang-18]
        build_type: [Debug, Release]
        include:
          - os: macos-14
            compiler: appleclang
            build_type: Release
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        env:
          OS: ${{ matrix.os }}
          COMPILER: ${{ matrix.compiler }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          case "$COMPILER" in
            gcc-*)
              package="g++-${COMPILER#gcc-}"
              echo "CC=$COMPILER" >> "$GITHUB_ENV"
              echo "CXX=g++-${COMPILER#gcc-}" >> "$GITHUB_ENV"
              ;;
            clang-*)
              package="$COMPILER"
              echo "CC=$COMPILER" >> "$GITHUB_ENV"
              echo "CXX=clang++-${COMPILER#clang-}" >> "$GITHUB_ENV"
              ;;
            *)
              package=""
              ;;
          esac
          if [ "$OS" = macos-14 ]; then
            brew install ninja
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ninja-build "$package"
          fi

      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build/ci

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure --no-tests=error

      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: build/**/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  sanitize:
    name: sanitize (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang-18
      CXX: clang++-18
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: address,undefined
            ctest_args: ""
          - sanitizer: thread
            ctest_args: --repeat until-fail:3
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang-18

      # ThreadSanitizer aborts with "unexpected memory mapping" under the runner's default ASLR
      # entropy.
      - name: Lower the address-space randomisation
        if: matrix.sanitizer == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake -S . -B build/sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DSHALE_SANITIZE=${{ matrix.sanitizer }}

      - name: Build
        run: cmake --build build/sanitize

      - name: Test
        env:
          CTEST_ARGS: ${{ matrix.ctest_args }}
        # CTEST_ARGS is deliberately unquoted: it is a list of words, and empty for the first entry.
        run: ctest --test-dir build/sanitize --output-on-failure --no-tests=error $CTEST_ARGS

      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-sanitize-${{ matrix.sanitizer }}
          path: build/**/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # A suite that has only passed has not shown that it can fail. Each job builds the simulator with
  # one deliberate flaw compiled in and requires it to go red, so a green job means the flaw was
  # caught, and its summary names the invariant that caught it. Keep the names in step with
  # SHALE_FLAW_NAMES in cmake/ShaleOptions.cmake.
  flaws:
    name: flaws (${{ matrix.flaw }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang-18
      CXX: clang++-18
    strategy:
      fail-fast: false
      matrix:
        flaw:
          - skip_wal_sync
          - skip_dir_sync
          - drop_tombstones_early
          - ignore_snapshots_in_compaction
          - skip_manifest_sync
          - delete_live_files
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang-18

      - name: Build the simulator with the flaw in, and require it to fail
        env:
          FLAW: ${{ matrix.flaw }}
        run: scripts/run-flaws.sh "$FLAW"

      - name: Upload the simulator output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sim-output-${{ matrix.flaw }}
          path: build/flaw-${{ matrix.flaw }}/sim-output.log
          if-no-files-found: ignore

  # The engine under a real kill: a writer process is stopped with SIGKILL at a random moment, and
  # every key it was told was stored must be there when the database is opened again. The simulator
  # cannot show this, since its filesystem is not the real one, and the unit tests never kill a
  # process. macOS is here because its Env syncs with F_FULLFSYNC, a different path from Linux's.
  crash:
    name: crash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        env:
          OS: ${{ matrix.os }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          if [ "$OS" = macos-14 ]; then
            brew install ninja
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ninja-build
          fi

      # Only the tool is built, so that GoogleTest is not fetched.
      - name: Configure
        run: >
          cmake -S . -B build/crash -G Ninja -DCMAKE_BUILD_TYPE=Release -DSHALE_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build/crash --target shale_crashtest

      # The seed changes with every run, so that the kills land in different places; it is printed
      # on the first line of the output, and with it a failed run can be repeated.
      - name: Kill the writer twenty times, and check the database each time
        env:
          SEED: ${{ github.run_number }}
        run: |
          mkdir -p "$RUNNER_TEMP/crash"
          build/crash/tools/shale_crashtest --rounds=20 --seed="$SEED" --db="$RUNNER_TEMP/crash/db"

      - name: Upload the database
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash-db-${{ matrix.os }}
          path: ${{ runner.temp }}/crash
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The whole history, so that check-hygiene.sh scans every commit message.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang-18 doxygen

      # Keep these versions in step with scripts/preflight.sh.
      - name: Install the pinned clang-format and clang-tidy
        run: |
          python3 -m venv "$RUNNER_TEMP/lint-tools"
          "$RUNNER_TEMP/lint-tools/bin/pip" install clang-format==23.1.3 clang-tidy==22.1.8
          echo "$RUNNER_TEMP/lint-tools/bin" >> "$GITHUB_PATH"

      - name: clang-format
        run: git ls-files -z -- '*.h' '*.cc' | xargs -0 -r clang-format --dry-run --Werror

      - name: Layering
        run: bash scripts/check-layering.sh

      - name: Hygiene
        run: bash scripts/check-hygiene.sh

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: >
          cmake -S . -B build/lint -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DSHALE_BUILD_TESTS=OFF

      - name: clang-tidy
        run: git ls-files -z -- 'src/*.cc' 'tools/*.cc' | xargs -0 -r clang-tidy -p build/lint --quiet

      - name: Doxygen
        run: cmake --build build/lint --target docs
